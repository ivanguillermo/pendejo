<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Informes a Excel</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --tx:#1d2330; --ac:#0b6bcb; --warn:#fff3cd; --bd:#d5d9e0; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14171d; --card:#1e232c; --tx:#e8ebf0; --ac:#4da3ff; --warn:#4a3d10; --bd:#39414f; } }
  * { box-sizing:border-box; font-family:system-ui,sans-serif; }
  body { margin:0; background:var(--bg); color:var(--tx); padding:16px; max-width:1100px; margin:auto; }
  .card { background:var(--card); border:1px solid var(--bd); border-radius:10px; padding:14px; margin-bottom:14px; }
  input, select, textarea { background:var(--card); color:var(--tx); border:1px solid var(--bd); border-radius:6px; padding:6px; width:100%; }
  button { background:var(--ac); color:#fff; border:0; border-radius:8px; padding:10px 16px; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:end; }
  .row > * { flex:1; min-width:140px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:8px; margin:10px 0; }
  .grid label { font-size:12px; opacity:.75; display:block; }
  .scroll { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; min-width:760px; font-size:13px; }
  td, th { border:1px solid var(--bd); padding:2px; }
  th { background:var(--bg); font-size:12px; }
  tr.rev td { background:var(--warn); }
  #estado { margin:8px 0; font-size:14px; }
</style>
</head>
<body>
<h2>📋 Informes de mantenimiento → Excel</h2>

<div class="card">
  <div class="row">
    <div><label>PIN</label><input id="pin" type="password" placeholder="PIN de acceso"></div>
    <div style="flex:3"><label>Fotos o PDF del informe (puedes elegir varias páginas)</label>
      <input id="archivos" type="file" accept="image/*,application/pdf" multiple></div>
    <button id="btnT" onclick="transcribir()">Transcribir</button>
  </div>
  <div id="estado"></div>
</div>

<div id="resultado"></div>
<button id="btnX" style="display:none" onclick="descargar()">⬇️ Descargar Excel</button>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyhEmvUGTJL62Fpei9abPuTOZXj9qnZ60gKsj8R9vDOcXRQZ9TJQvsdDedeYu7VZiTO/exec";
const ESTADOS = { ok: "✓ Realizado", no: "✗ No / N/A", valor: "Valor", vacio: "" };
let ordenes = [];
const $ = id => document.getElementById(id);
$("pin").value = localStorage.getItem("inf_pin") || "";

function aB64(file) {
  return new Promise((ok, err) => { const r = new FileReader(); r.onload = () => ok(r.result.split(",")[1]); r.onerror = err; r.readAsDataURL(file); });
}

// Las fotos se reducen a 2000 px (la letra a mano necesita resolución); los PDF van tal cual
function preparar(file) {
  if (!file.type.startsWith("image/")) return aB64(file).then(d => ({ mime: file.type, data: d }));
  return new Promise((ok, err) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const k = Math.min(1, 2000 / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = img.width * k; c.height = img.height * k;
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      ok({ mime: "image/jpeg", data: c.toDataURL("image/jpeg", 0.9).split(",")[1] });
    };
    img.onerror = () => err(new Error("No se pudo leer " + file.name));
    img.src = url;
  });
}

async function transcribir() {
  const files = [...$("archivos").files];
  if (!files.length) return alert("Elige al menos un archivo");
  if (SCRIPT_URL.startsWith("PEGA")) return alert("Falta pegar la URL del Apps Script en SCRIPT_URL");
  localStorage.setItem("inf_pin", $("pin").value);
  $("btnT").disabled = true; $("estado").textContent = "⏳ Leyendo el informe (puede tardar ~30 s)...";
  try {
    const archivos = await Promise.all(files.map(preparar));
    const res = await fetch(SCRIPT_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "transcribir", pin: $("pin").value, archivos }) });
    const r = await res.json();
    if (r.status !== "success") throw new Error(r.message);
    ordenes = r.ordenes;
    const dudas = ordenes.reduce((n, o) => n + (o.operaciones || []).filter(x => x.revisar).length, 0);
    $("estado").textContent = `✅ ${ordenes.length} orden(es) leída(s). ${dudas ? "Revisa las " + dudas + " fila(s) amarillas." : "Sin dudas marcadas."} Corrige lo que haga falta antes de descargar.`;
    render();
  } catch (e) { $("estado").textContent = "❌ " + e.message; }
  $("btnT").disabled = false;
}

function inp(obj, key) { const i = document.createElement("input"); i.value = obj[key] ?? ""; i.oninput = () => { obj[key] = i.value; }; return i; }
function campo(obj, key, etiqueta) { const d = document.createElement("div"); const l = document.createElement("label"); l.textContent = etiqueta; d.append(l, inp(obj, key)); return d; }

function render() {
  const cont = $("resultado"); cont.innerHTML = "";
  ordenes.forEach(o => {
    o.operaciones = o.operaciones || [];
    const card = document.createElement("div"); card.className = "card";
    const g = document.createElement("div"); g.className = "grid";
    [["ot","OT"],["fecha_ejecucion","Fecha ejecución"],["descripcion","Descripción"],["puesto_resp","Puesto resp."],["ubicacion","Ubicación"],["equipo","Equipo"],["subequipo","Subequipo"]]
      .forEach(([k, l]) => g.append(campo(o, k, l)));
    const tb = document.createElement("table");
    tb.innerHTML = "<tr><th>Op</th><th>SOp</th><th>Operación</th><th>Plan h</th><th>Real h</th><th>Estado</th><th>Observación</th><th>Dudosa</th></tr>";
    o.operaciones.forEach(x => {
      const tr = document.createElement("tr"); if (x.revisar) tr.className = "rev";
      [["op"],["sop"],["operacion"],["plan_h"],["real_h"]].forEach(([k]) => { const td = document.createElement("td"); td.append(inp(x, k)); tr.append(td); });
      const sel = document.createElement("select");
      Object.keys(ESTADOS).forEach(k => { const op = new Option(ESTADOS[k] || "(vacío)", k); sel.add(op); });
      sel.value = x.estado || "vacio"; sel.onchange = () => { x.estado = sel.value; };
      const tdE = document.createElement("td"); tdE.append(sel);
      const tdO = document.createElement("td"); tdO.append(inp(x, "observacion"));
      const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = !!x.revisar;
      cb.onchange = () => { x.revisar = cb.checked; tr.className = cb.checked ? "rev" : ""; };
      const tdC = document.createElement("td"); tdC.append(cb);
      tr.append(tdE, tdO, tdC); tb.append(tr);
    });
    const sc = document.createElement("div"); sc.className = "scroll"; sc.append(tb);
    const nl = document.createElement("label"); nl.textContent = "Notas a mano";
    const ta = document.createElement("textarea"); ta.rows = 3; ta.value = o.notas || ""; ta.oninput = () => { o.notas = ta.value; };
    const g2 = document.createElement("div"); g2.className = "grid";
    [["realizado_por","Realizado por"],["cargo","Cargo"],["fecha_fin","Fecha fin"],["tiempo_total_plan","Total plan"],["tiempo_total_real","Total real"]]
      .forEach(([k, l]) => g2.append(campo(o, k, l)));
    card.append(g, sc, nl, ta, g2); cont.append(card);
  });
  $("btnX").style.display = ordenes.length ? "inline-block" : "none";
}

function descargar() {
  const wb = XLSX.utils.book_new();
  const cab = ordenes.map(o => ({ OT: o.ot, Fecha: o.fecha_ejecucion, Descripcion: o.descripcion, "Puesto resp.": o.puesto_resp, Ubicacion: o.ubicacion,
    Equipo: o.equipo, Subequipo: o.subequipo, "Realizado por": o.realizado_por, Cargo: o.cargo, "Fecha fin": o.fecha_fin, "Total plan": o.tiempo_total_plan, "Total real": o.tiempo_total_real }));
  const ops = [];
  ordenes.forEach(o => (o.operaciones || []).forEach(x => ops.push({ OT: o.ot, Fecha: o.fecha_ejecucion, Equipo: o.equipo, Op: x.op, SOp: x.sop,
    Operacion: x.operacion, "Plan (h)": x.plan_h, "Real (h)": x.real_h, Estado: ESTADOS[x.estado] || "", Observacion: x.observacion, Dudosa: x.revisar ? "SI" : "" })));
  const notas = ordenes.filter(o => o.notas).map(o => ({ OT: o.ot, Equipo: o.equipo, Notas: o.notas }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(cab), "Ordenes");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(ops), "Operaciones");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(notas.length ? notas : [{ OT: "", Equipo: "", Notas: "" }]), "Notas");
  XLSX.writeFile(wb, "informes_" + new Date().toISOString().slice(0, 10) + ".xlsx");
}
</script>
</body>
</html>
