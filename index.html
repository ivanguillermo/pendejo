<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Producto con IA y Auth</title>
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        
        #loginScreen { text-align: center; width: 100%; max-width: 400px; background: #1e293b; padding: 30px; border-radius: 12px; border: 1px solid #334155; }
        #appContainer { display: none; width: 100%; max-width: 650px; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px solid #334155; }
        
        .header-app { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        h2 { color: #38bdf8; margin: 0; font-size: 18px; }
        .btn-salir { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .full { grid-column: span 2; }
        label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: white; font-size: 14px; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #38bdf8; }
        textarea { resize: vertical; height: 80px; }
        
        button.btn-guardar { background: #10b981; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; margin-top: 20px; transition: background 0.2s; }
        button.btn-guardar:hover { background: #059669; }
        
        #loading { display: none; text-align: center; color: #38bdf8; margin: 10px 0; font-weight: 500; font-size: 13px; }
    </style>
</head>
<body>

    <!-- PANTALLA 1: LOGIN DE GOOGLE -->
    <div id="loginScreen">
        <h2>🔒 Acceso Restringido</h2>
        <p style="color:#94a3b8; font-size:13px; margin: 15px 0 25px 0;">Inicia sesión con tu cuenta de Google autorizada para continuar.</p>
        
        <div id="g_id_onload"
             data-client_id="366811567796-abf3n9eegpg29qrf2d6qiqp1c4e3fm98.apps.googleusercontent.com"
             data-callback="handleCredentialResponse">
        </div>
        <div class="g_id_signin" data-type="standard" data-size="large" data-theme="filled_black"></div>
        <div id="loginError" style="color:#ef4444; margin-top:15px; display:none; font-size: 13px;">⛔ Acceso no autorizado para este correo.</div>
    </div>

    <!-- PANTALLA 2: FORMULARIO DE PRODUCTO -->
    <div id="appContainer">
        <div class="header-app">
            <h2>+ Registrar Producto con IA</h2>
            <button class="btn-salir" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>

        <div class="grid">
            <div class="full" style="background: #0f172a; padding: 15px; border-radius: 8px; border: 1px dashed #38bdf8;">
                <label style="color: #38bdf8; font-weight: bold; margin-bottom: 10px;">📸 Imagen del Producto y Análisis IA</label>
                
                <div style="margin-bottom: 10px;">
                    <label style="font-size: 11px; color: #94a3b8;">Nombre del archivo en Drive:</label>
                    <input type="text" id="nombreImagenPersonalizado" placeholder="Ej: Correa_Cuero_Negro" style="font-size: 13px;">
                </div>

                <div style="margin-bottom: 10px;">
                    <input type="file" id="fotoInput" accept="image/*" capture="environment" onchange="ejecutarSubidaYAnalisis(this)" style="font-size: 12px;">
                </div>

                <div id="previewContainer" style="display: none; margin-top: 10px; text-align: center;">
                    <img id="imgPreview" src="" alt="Vista previa" style="max-height: 150px; border-radius: 6px; border: 1px solid #334155; display: inline-block;">
                    <p style="font-size: 10px; color: #10b981; margin-top: 4px;">✓ Imagen cargada</p>
                </div>
            </div>

            <div id="loading" class="full">🤖 Subiendo a Drive y analizando con IA... ⏳</div>

            <div class="full">
                <label>Nombre del Producto:</label>
                <input type="text" id="nombre" placeholder="Ej: Correa Minimalista">
            </div>

            <div>
                <label>Precio ($):</label>
                <input type="number" step="0.01" id="precio" placeholder="0.00">
            </div>

            <div>
                <label>Costo ($):</label>
                <input type="number" step="0.01" id="costo" placeholder="0.00">
            </div>

            <div>
                <label>Categoría:</label>
                <input type="text" id="categoria" placeholder="Categoría detectada">
            </div>

            <div>
                <label>Subcategoría:</label>
                <input type="text" id="categoria_secundaria" placeholder="Subcategoría">
            </div>

            <div>
                <label>Proveedor:</label>
                <input type="text" id="proveedor" placeholder="Nombre del proveedor">
            </div>

            <div>
                <label>Coleccion:</label>
                <input type="text" id="coleccion" placeholder="Colección">
            </div>

            <div>
                <label>Talla / Medida:</label>
                <input type="text" id="talla" placeholder="Ej: Única">
            </div>

            <div>
                <label>Stock:</label>
                <input type="number" id="stock" placeholder="0">
            </div>

            <div class="full">
                <label>Descripción:</label>
                <textarea id="descripcion" placeholder="Detalle del producto"></textarea>
            </div>
        </div>

        <button class="btn-guardar" onclick="guardarProductoFinal()">💾 Guardar en Catalogo1</button>
    </div>

    <!-- Vinculación del script externo ordenado -->
    <script src="producto.js"></script>
</body>
</html>
