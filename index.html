<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Nuevo Producto</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; }
        .card { background: #1e293b; width: 100%; max-width: 600px; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2 { color: #38bdf8; margin-top: 0; display: flex; align-items: center; gap: 8px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .full { grid-column: span 2; }
        label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: white; font-size: 14px; box-sizing: border-box; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #38bdf8; }
        textarea { resize: vertical; height: 80px; }
        button { background: #10b981; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; margin-top: 20px; transition: background 0.2s; }
        button:hover { background: #059669; }
        #loading { display: none; text-align: center; color: #38bdf8; margin: 15px 0; font-weight: 500; }
    </style>
</head>
<body>

    <div class="card">
        <h2>+ Registrar Nuevo Producto</h2>
        <p style="font-size: 13px; color: #94a3b8; margin-bottom: 20px;">Sube la foto del producto para que la IA precargue la información automáticamente.</p>

        <div class="grid">
            <div class="full">
                <label>Imagen Local / Foto del Producto:</label>
                <input type="file" id="fotoInput" accept="image/*" capture="environment" onchange="procesarImagenConIA()">
            </div>

            <div id="loading" class="full">Analizando imagen con IA y subiendo al Drive... ⏳</div>

            <div class="full">
                <label>Nombre del Producto:</label>
                <input type="text" id="nombre" placeholder="Ej: Correa Minimalista">
            </div>

            <div>
                <label>Precio ($):</label>
                <input type="number" step="0.01" id="precio" placeholder="0.00">
            </div>

            <div>
                <label>Costo ($):</label>
                <input type="number" step="0.01" id="costo" placeholder="0.00">
            </div>

            <div>
                <label>Categoría:</label>
                <input type="text" id="categoria" placeholder="Categoría detectada">
            </div>

            <div>
                <label>Subcategoría:</label>
                <input type="text" id="categoria_secundaria" placeholder="Subcategoría">
            </div>

            <div>
                <label>Proveedor:</label>
                <input type="text" id="proveedor" placeholder="Nombre del proveedor">
            </div>

            <div>
                <label>Colección:</label>
                <input type="text" id="coleccion" placeholder="Colección">
            </div>

            <div>
                <label>Talla / Medida:</label>
                <input type="text" id="talla" placeholder="Ej: Única">
            </div>

            <div>
                <label>Stock:</label>
                <input type="number" id="stock" placeholder="0">
            </div>

            <div class="full">
                <label>Descripción:</label>
                <textarea id="descripcion" placeholder="Detalle del producto"></textarea>
            </div>
        </div>

        <button onclick="guardarProductoFinal()">💾 Guardar y Publicar</button>
    </div>

    <script>
        const URL_WEBAPP = "https://script.google.com/macros/s/AKfycbzME-FmmKpKNiCLux-egjHcesS_p5NAB2kyGlyv2UIykWjxyH-cB9uJDoQjdaWoUdTY/exec"; // Pega aquí tu URL de Apps Script
        let imagenDriveUrl = "";

        async function procesarImagenConIA() {
            const input = document.getElementById('fotoInput');
            const loading = document.getElementById('loading');

            if (input.files.length === 0) return;

            const file = input.files[0];
            loading.style.display = "block";

            const reader = new FileReader();
            reader.readAsDataURL(file);

            reader.onload = async function () {
                const base64Data = reader.result;

                try {
                    const response = await fetch(URL_WEBAPP, {
                        method: "POST",
                        body: JSON.stringify({
                            action: "analizar",
                            image: base64Data,
                            mimeType: file.type
                        })
                    });

                    const result = await response.json();
                    loading.style.display = "none";

                    if (result.status === "success") {
                        // Prellenar los campos con lo que sugirió la IA
                        document.getElementById('nombre').value = result.sugerencia.nombre || "";
                        document.getElementById('categoria').value = result.sugerencia.categoria || "";
                        document.getElementById('categoria_secundaria').value = result.sugerencia.categoria_secundaria || "";
                        document.getElementById('coleccion').value = result.sugerencia.coleccion || "";
                        document.getElementById('descripcion').value = result.sugerencia.descripcion || "";
                        
                        // Guardar la URL de la imagen en Drive para enviarla al registrar
                        imagenDriveUrl = result.imagen_drive || "";
                        alert("¡IA analizó el producto con éxito! Revisa y completa los datos de precio, costo y stock.");
                    } else {
                        alert("Error al analizar: " + result.message);
                    }
                } catch (error) {
                    loading.style.display = "none";
                    alert("Error de conexión: " + error.message);
                }
            };
        }

        async function guardarProductoFinal() {
            const producto = {
                nombre: document.getElementById('nombre').value,
                precio: document.getElementById('precio').value,
                costo: document.getElementById('costo').value,
                categoria: document.getElementById('categoria').value,
                categoria_secundaria: document.getElementById('categoria_secundaria').value,
                proveedor: document.getElementById('proveedor').value,
                coleccion: document.getElementById('coleccion').value,
                talla: document.getElementById('talla').value,
                stock: document.getElementById('stock').value,
                descripcion: document.getElementById('descripcion').value,
                imagen_drive: imagenDriveUrl
            };

            if (!producto.nombre) {
                alert("Por favor ingresa o procesa un nombre para el producto.");
                return;
            }

            try {
                const response = await fetch(URL_WEBAPP, {
                    method: "POST",
                    body: JSON.stringify({
                        action: "guardar",
                        producto: producto
                    })
                });

                const result = await response.json();
                if (result.status === "success") {
                    alert("¡Producto registrado y guardado en Catalogo1 con éxito!");
                    location.reload(); // Recargar formulario limpio
                } else {
                    alert("Error al guardar: " + result.message);
                }
            } catch (error) {
                alert("Error de red al guardar: " + error.message);
            }
        }
    </script>
</body>
</html>
