<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Producto con IA y Auth</title>
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        
        /* PANTALLA DE LOGIN */
        #loginScreen { text-align: center; width: 100%; max-width: 400px; background: #1e293b; padding: 30px; border-radius: 12px; border: 1px solid #334155; }
        
        /* APP CONTAINER */
        #appContainer { display: none; width: 100%; max-width: 650px; background: #1e293b; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); border: 1px solid #334155; }
        
        .header-app { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        h2 { color: #38bdf8; margin: 0; font-size: 18px; }
        .btn-salir { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .full { grid-column: span 2; }
        label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: white; font-size: 14px; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #38bdf8; }
        textarea { resize: vertical; height: 80px; }
        
        button.btn-guardar { background: #10b981; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; font-size: 16px; margin-top: 20px; transition: background 0.2s; }
        button.btn-guardar:hover { background: #059669; }
        
        #loading { display: none; text-align: center; color: #38bdf8; margin: 10px 0; font-weight: 500; font-size: 13px; }
    </style>
</head>
<body>

    <!-- PANTALLA 1: LOGIN DE GOOGLE -->
    <div id="loginScreen">
        <h2>🔒 Acceso Restringido</h2>
        <p style="color:#94a3b8; font-size:13px; margin: 15px 0 25px 0;">Inicia sesión con tu cuenta de Google autorizada para continuar.</p>
        
        <!-- ÚNICO BLOQUE DE INICIALIZACIÓN DE GOOGLE OAUTH -->
        <div id="g_id_onload"
             data-client_id="366811567796-abf3n9eegpg29qrf2d6qiqp1c4e3fm98.apps.googleusercontent.com"
             data-callback="handleCredentialResponse">
        </div>
        <div class="g_id_signin" data-type="standard" data-size="large" data-theme="filled_black"></div>
        <div id="loginError" style="color:#ef4444; margin-top:15px; display:none; font-size: 13px;">⛔ Acceso no autorizado para este correo.</div>
    </div>

    <!-- PANTALLA 2: FORMULARIO DE PRODUCTO -->
    <div id="appContainer">
        <div class="header-app">
            <h2>+ Registrar Producto con IA</h2>
            <button class="btn-salir" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>

        <div class="grid">
            <div class="full" style="background: #0f172a; padding: 12px; border-radius: 6px; border: 1px dashed #38bdf8;">
                <label style="color: #38bdf8; margin-bottom: 8px;">Imagen del Producto:</label>
                
                <!-- Opción A: Subir desde dispositivo -->
                <div style="margin-bottom: 10px;">
                    <label style="font-size: 11px; color: #94a3b8;">Subir desde el dispositivo:</label>
                    <input type="file" id="fotoInput" accept="image/*" capture="environment" onchange="procesarImagenConIA()">
                </div>

                <!-- Opción B: O pegar enlace directo de una foto que ya está en Drive -->
                <div>
                    <label style="font-size: 11px; color: #94a3b8;">O pega el enlace de Google Drive existente:</label>
                    <input type="text" id="linkDriveManual" placeholder="https://drive.google.com/file/d/..." style="font-size: 12px;">
                </div>
            </div>

            <div id="loading" class="full">🤖 Analizando imagen con IA... ⏳</div>

            <div class="full">
                <label>Nombre del Producto:</label>
                <input type="text" id="nombre" placeholder="Ej: Correa Minimalista">
            </div>

            <div>
                <label>Precio ($):</label>
                <input type="number" step="0.01" id="precio" placeholder="0.00">
            </div>

            <div>
                <label>Costo ($):</label>
                <input type="number" step="0.01" id="costo" placeholder="0.00">
            </div>

            <div>
                <label>Categoría:</label>
                <input type="text" id="categoria" placeholder="Categoría detectada">
            </div>

            <div>
                <label>Subcategoría:</label>
                <input type="text" id="categoria_secundaria" placeholder="Subcategoría">
            </div>

            <div>
                <label>Proveedor:</label>
                <input type="text" id="proveedor" placeholder="Nombre del proveedor">
            </div>

            <div>
                <label>Colección:</label>
                <input type="text" id="coleccion" placeholder="Colección">
            </div>

            <div>
                <label>Talla / Medida:</label>
                <input type="text" id="talla" placeholder="Ej: Única">
            </div>

            <div>
                <label>Stock:</label>
                <input type="number" id="stock" placeholder="0">
            </div>

            <div class="full">
                <label>Descripción:</label>
                <textarea id="descripcion" placeholder="Detalle del producto"></textarea>
            </div>
        </div>

        <button class="btn-guardar" onclick="guardarProductoFinal()">💾 Guardar en Catalogo1</button>
    </div>

    <script>
        const ADMIN_EMAILS = ["ivanglopezp@gmail.com", "equ1strec3@gmail.com", "paulaherro.05@gmail.com"];
        const URL_WEBAPP = "https://script.google.com/macros/s/AKfycbwgnoWOlrHjzXANUH-re_AOfVJd7zaZyvoVA4pgCF7kUOFIxKrGXPekdjZd_1HmI4na/exec";
        let imagenDriveUrl = "";

        function parseJwt(token) {
            try {
                const base64Url = token.split('.')[1];
                const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
                return JSON.parse(decodeURIComponent(window.atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join('')));
            } catch(e) { return null; }
        }

        function handleCredentialResponse(response) {
            const payload = parseJwt(response.credential);
            if (!payload || !payload.email) return;
            
            if (ADMIN_EMAILS.includes(payload.email.toLowerCase())) {
                sessionStorage.setItem("auth", "true");
                sessionStorage.setItem("userEmail", payload.email);
                mostrarApp();
            } else {
                document.getElementById("loginError").style.display = "block";
            }
        }

        function mostrarApp() {
            document.getElementById("loginScreen").style.display = "none";
            document.getElementById("appContainer").style.display = "block";
        }

        function cerrarSesion() {
            sessionStorage.clear();
            window.location.reload();
        }

        window.onload = function() {
            if (sessionStorage.getItem("auth") === "true") {
                mostrarApp();
            }
        };

        async function procesarImagenConIA() {
            const input = document.getElementById('fotoInput');
            const loading = document.getElementById('loading');

            if (input.files.length === 0) return;

            const file = input.files[0];
            loading.style.display = "block";

            const reader = new FileReader();
            reader.readAsDataURL(file);

            reader.onload = async function () {
                const base64Data = reader.result;

                try {
                    const response = await fetch(URL_WEBAPP, {
                        method: "POST",
                        body: JSON.stringify({
                            action: "analizar",
                            image: base64Data,
                            mimeType: file.type
                        })
                    });

                    const result = await response.json();
                    loading.style.display = "none";

                    if (result.status === "success") {
                        document.getElementById('nombre').value = result.sugerencia.nombre || "";
                        document.getElementById('categoria').value = result.sugerencia.categoria || "";
                        document.getElementById('categoria_secundaria').value = result.sugerencia.categoria_secundaria || "";
                        document.getElementById('coleccion').value = result.sugerencia.coleccion || "";
                        document.getElementById('descripcion').value = result.sugerencia.descripcion || "";
                        
                        alert("✨ ¡IA precargó los datos con éxito! Revisa, completa precio/costo/stock y guarda.");
                    } else {
                        alert("Error al analizar: " + result.message);
                    }
                } catch (error) {
                    loading.style.display = "none";
                    alert("Error de conexión: " + error.message);
                }
            };
        }

        async function guardarProductoFinal() {
            const fileInput = document.getElementById('fotoInput');
            let base64Imagen = "";
            let nombreImagen = "producto.jpg";

            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                nombreImagen = file.name;
                // Convertir la foto seleccionada a base64 para enviarla al backend
                base64Imagen = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.readAsDataURL(file);
                });
            }

            const producto = {
                nombre: document.getElementById('nombre').value,
                precio: document.getElementById('precio').value,
                costo: document.getElementById('costo').value,
                categoria: document.getElementById('categoria').value,
                categoria_secundaria: document.getElementById('categoria_secundaria').value,
                proveedor: document.getElementById('proveedor').value,
                coleccion: document.getElementById('coleccion').value,
                talla: document.getElementById('talla').value,
                stock: document.getElementById('stock').value,
                descripcion: document.getElementById('descripcion').value,
                imagenBase64: base64Imagen,
                imagenNombre: nombreImagen
            };

            if (!producto.nombre) {
                alert("Por favor ingresa un nombre para el producto.");
                return;
            }

            try {
                const response = await fetch(URL_WEBAPP, {
                    method: "POST",
                    redirect: "follow",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({
                        action: "guardar",
                        producto: producto
                    })
                });

                const textResponse = await response.text();
                const result = JSON.parse(textResponse);

                if (result.status === "success") {
                    alert("✅ ¡Imagen guardada en Drive y producto registrado en Catalogo1!");
                    location.reload();
                } else {
                    alert("Error al guardar: " + result.message);
                }
            } catch (error) {
                alert("Error de red al guardar: " + error.message);
            }
        }
    </script>
</body>
</html>
